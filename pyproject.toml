[project]
name = "pyanim"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SwinkyWorks", email = "97905094+SwinkyWorks@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pyside6==6.8.3",
    "shiboken6==6.8.3",
]

[project.scripts]
pyanim = "pyanim:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
